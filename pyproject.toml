[project]
name = "mhs_scripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jason Tang", email = "jason.tang@berkeley.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "pymeasure",
    "pyusb>=1.3.1",
    "pyvisa-py>=0.8.1",
    "zeroconf>=0.151.5",
]

[project.scripts]
volt = "mhs_scripts.voltage_test:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
pymeasure = { git = "https://github.com/Jaysoar/pymeasure.git", rev = "dev/agilent-33622a" }
